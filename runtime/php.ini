; Portable Crab PHP configuration. Data is stored outside the release directory.
extension_dir = "ext"
extension = mbstring
extension = pdo_sqlite
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
date.timezone = Asia/Colombo
