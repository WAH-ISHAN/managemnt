name: LifeOS Windows release

on:
  pull_request:
    branches: [main]
    paths: ['LifeOS/**', '.github/workflows/lifeos-release.yml']
  push:
    branches: [main]
    paths: ['LifeOS/**', '.github/workflows/lifeos-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh
    working-directory: LifeOS

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, sodium, zip, fileinfo, curl
          tools: composer
          coverage: none
        env:
          phpts: nts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare persona browser checks
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed.' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
      - name: Verify application services, routes and scripts
        run: ./scripts/Invoke-QA.ps1
      - name: Verify portable update packaging and rollback
        run: |
          ./tests/update_package.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable update package fixture failed.' }
          ./tests/update_delivery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Update delivery suite failed.' }
          ./tests/update_notification_contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Update notification contract failed.' }
      - name: Compile Windows launcher
        run: |
          dotnet build launcher/LifeOS.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-qa-${{ github.run_id }}
          path: ${{ github.workspace }}/LifeOS/tests/.tmp/qa-*/
          include-hidden-files: true
          retention-days: 7

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, sodium, zip, fileinfo, curl
          tools: none
          coverage: none
        env:
          phpts: nts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare trusted Windows build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,1641,3010)) { throw 'Inno Setup installation failed.' }
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile '.tools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $runtime = Get-Item '.tools/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime.FullName
          if ($runtime.Length -lt 50000000 -or $signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Expected the Microsoft-signed offline WebView2 x64 standalone installer.' }
          # Redistribute the same owner-approved runtime; no model weights.
          Invoke-WebRequest -Uri 'https://github.com/anomalyco/opencode/releases/download/v2.2.5/opencode-windows-x64.zip' -OutFile '.tools/opencode.zip'
          if((Get-FileHash '.tools/opencode.zip' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2f3bfd6b3527c60c2a882557b20ddc9ba6bdff4b5a8fe61c853da8fcfb3076e8'){throw 'AI runtime integrity check failed.'}
          Expand-Archive -LiteralPath '.tools/opencode.zip' -DestinationPath '.tools/ai-runtime'
      - name: Stamp merged-main release identity
        run: |
          [xml]$project = Get-Content launcher/LifeOS.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a semantic application version.' }
          $metadata = [ordered]@{schemaVersion=1;product='LifeOS';repository=$env:GITHUB_REPOSITORY;channel='stable';version=$version;buildNumber=[int]$env:BUILD_NUMBER;commit=$env:GITHUB_SHA}
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'lifeos-release.json'),($metadata | ConvertTo-Json -Compress),(New-Object Text.UTF8Encoding($false)))
          "LIFEOS_VERSION=$version" >> $env:GITHUB_ENV
          "LIFEOS_TAG=lifeos-$version-build.$env:BUILD_NUMBER" >> $env:GITHUB_ENV
      - name: Build installer and portable update
        env:
          LIFEOS_COMMERCIAL: ${{ vars.LIFEOS_COMMERCIAL }}
          LIFEOS_LICENSE_PUBLIC_KEY: ${{ vars.LIFEOS_LICENSE_PUBLIC_KEY }}
          LIFEOS_REQUIRE_SIGNING: ${{ vars.LIFEOS_REQUIRE_SIGNING }}
          LIFEOS_SIGNING_PFX_BASE64: ${{ secrets.LIFEOS_SIGNING_PFX_BASE64 }}
          LIFEOS_SIGNING_PFX_PASSWORD: ${{ secrets.LIFEOS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $licenseArgs=@{}
          if($env:LIFEOS_COMMERCIAL -eq 'true'){$licenseArgs=@{Commercial=$true;LicensePublicKey=$env:LIFEOS_LICENSE_PUBLIC_KEY}}
          $signingArgs=@{}
          $certificate=$null
          $pfxPath=Join-Path $env:RUNNER_TEMP 'lifeos-signing.pfx'
          try {
            $hasPfx=-not [string]::IsNullOrWhiteSpace($env:LIFEOS_SIGNING_PFX_BASE64)
            $hasPassword=-not [string]::IsNullOrWhiteSpace($env:LIFEOS_SIGNING_PFX_PASSWORD)
            if($hasPfx -ne $hasPassword){throw 'Both LifeOS signing certificate secrets must be configured together.'}
            if($env:LIFEOS_REQUIRE_SIGNING -eq 'true' -and -not $hasPfx){throw 'This release requires signing, but no signing certificate is configured.'}
            if($hasPfx){
              [IO.File]::WriteAllBytes($pfxPath,[Convert]::FromBase64String($env:LIFEOS_SIGNING_PFX_BASE64))
              $password=ConvertTo-SecureString $env:LIFEOS_SIGNING_PFX_PASSWORD -AsPlainText -Force
              $certificate=@(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false)
              if($certificate.Count -ne 1 -or -not $certificate[0].HasPrivateKey){throw 'Expected one code-signing certificate with a private key.'}
              Remove-Item -LiteralPath $pfxPath -Force
              Remove-Item Env:LIFEOS_SIGNING_PFX_BASE64,Env:LIFEOS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
              $password=$null
              $signTool=Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -File | Where-Object {$_.Directory.Name -eq 'x64'} | Sort-Object FullName -Descending | Select-Object -First 1
              if(-not $signTool){throw 'signtool.exe was not found on the Windows release runner.'}
              $signingArgs=@{SigningCertificateThumbprint=$certificate[0].Thumbprint;SignTool=$signTool.FullName}
            }
            ./build.ps1 -AiExecutable '.tools/ai-runtime/opencode.exe' @licenseArgs @signingArgs
            ./scripts/New-UpdatePackage.ps1 -Version $env:LIFEOS_VERSION -BuildNumber ([int]$env:BUILD_NUMBER) -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
          } finally {
            if($certificate){$certificate | ForEach-Object {Remove-Item -LiteralPath (Join-Path 'Cert:\CurrentUser\My' $_.Thumbprint) -Force}}
            if(Test-Path -LiteralPath $pfxPath){Remove-Item -LiteralPath $pfxPath -Force}
            Remove-Item Env:LIFEOS_SIGNING_PFX_BASE64,Env:LIFEOS_SIGNING_PFX_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Verify update delivery against disposable installations
        run: ./tests/update_delivery.ps1
      - name: Upload immutable assets to a draft, then publish
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:LIFEOS_TAG --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) { throw 'This build tag already exists. Start a new workflow run; published releases are not overwritten.' }
          gh release create $env:LIFEOS_TAG --draft --target $env:GITHUB_SHA --title "LifeOS $env:LIFEOS_VERSION (build $env:BUILD_NUMBER)" --notes "Verified Windows release from merged main commit $env:GITHUB_SHA. Personal records remain on your computer."
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          gh release upload $env:LIFEOS_TAG Output/LifeOS-Setup.exe Output/LifeOS-Setup.exe.sha256 Output/LifeOS-update.zip Output/lifeos-update.json Output/LifeOS-release-verification.json Output/LifeOS-build-inputs.json
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          $release = gh release view $env:LIFEOS_TAG --json assets | ConvertFrom-Json
          $manifest = Get-Content Output/lifeos-update.json -Raw | ConvertFrom-Json
          foreach ($asset in @(@{name='LifeOS-update.zip';size=$manifest.package.size},@{name='LifeOS-Setup.exe';size=$manifest.installer.size},@{name='LifeOS-Setup.exe.sha256';size=(Get-Item Output/LifeOS-Setup.exe.sha256).Length},@{name='lifeos-update.json';size=(Get-Item Output/lifeos-update.json).Length},@{name='LifeOS-release-verification.json';size=(Get-Item Output/LifeOS-release-verification.json).Length},@{name='LifeOS-build-inputs.json';size=(Get-Item Output/LifeOS-build-inputs.json).Length})) {
            $remote = @($release.assets | Where-Object name -eq $asset.name)
            if ($remote.Count -ne 1 -or $remote[0].size -ne $asset.size) { throw 'Published asset readiness verification failed; release remains a draft.' }
          }
          gh release edit $env:LIFEOS_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
