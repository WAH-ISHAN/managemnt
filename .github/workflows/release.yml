name: Release Crab for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build interface assets
        run: |
          npm ci
          npm run build:visuals
      - name: Check PHP files
        shell: pwsh
        run: |
          php -r "if (!extension_loaded('pdo_sqlite') || !extension_loaded('mbstring')) exit(1);"
          if ($LASTEXITCODE -ne 0) { throw 'Required PHP extensions are missing.' }
          Get-ChildItem app -Recurse -Filter *.php | ForEach-Object {
            php -l $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "PHP syntax failed: $($_.FullName)" }
          }
      - name: Exercise application flows
        run: python tests/smoke.py
      - name: Build Windows package
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = 'v' + $env:RUN_NUMBER + '-' + $env:SHA.Substring(0, 7)
          New-Item -ItemType Directory -Path package, package/runtime | Out-Null
          Copy-Item -LiteralPath app -Destination package -Recurse
          Copy-Item -LiteralPath Start-Crab.ps1, Update-Crab.ps1, Install-Crab.ps1 -Destination package
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /out:package\Crab.exe launcher\Crab.cs
          if ($LASTEXITCODE -ne 0) { throw 'Crab.exe compilation failed.' }
          $phpDirectory = Split-Path (Get-Command php.exe).Source
          Copy-Item -Path (Join-Path $phpDirectory '*') -Destination package/runtime -Recurse -Force
          Copy-Item -LiteralPath runtime/php.ini -Destination package/runtime/php.ini -Force
          & package/runtime/php.exe -c package/runtime/php.ini -r "if (!extension_loaded('pdo_sqlite') || !extension_loaded('mbstring')) exit(1);"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged PHP runtime is missing required extensions.' }
          @{ version = $version; buildNumber = [int64]$env:RUN_NUMBER; repository = $env:REPOSITORY } |
            ConvertTo-Json -Compress | Set-Content -LiteralPath package/crab-release.json -Encoding UTF8
          if (-not (Test-Path package/runtime/php.exe)) { throw 'PHP runtime was not packaged.' }
          Compress-Archive -Path package/* -DestinationPath crab-windows.zip -CompressionLevel Optimal
          & $compiler /nologo /target:winexe /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /resource:crab-windows.zip,crab-package /out:Crab-Setup.exe launcher\CrabSetup.cs
          if ($LASTEXITCODE -ne 0) { throw 'Crab-Setup.exe compilation failed.' }
          "CRAB_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:CRAB_VERSION crab-windows.zip Crab-Setup.exe --target $env:GITHUB_SHA --title "Crab $env:CRAB_VERSION" --notes "Automatic Windows release from the main branch."
