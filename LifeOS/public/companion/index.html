<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254f43"><title>LifeOS companion</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><h1>LifeOS companion</h1><p>Keep your task list on this phone and capture tasks offline. Local copies remain on this phone until you clear them.</p><p id="status" role="status"></p><form id="pair"><label>Pairing code<input name="code" required autocomplete="off"></label><button>Pair with your PC</button></form><form id="capture"><label>Task<input name="title" maxlength="200" required></label><label>Due date<input type="date" name="due"></label><button>Save task on this phone</button></form><button id="sync">Sync with PC</button><button id="clear">Disconnect and erase local copies</button><h2>Saved tasks</h2><ul id="tasks"></ul><h2>Waiting to sync</h2><ul id="queue"></ul></main></body></html>
