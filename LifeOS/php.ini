extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=zip
extension=fileinfo
extension=curl
date.timezone=Asia/Colombo
display_errors=Off
log_errors=On
error_log=data/php_error.log
session.save_path=data/sessions
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Strict
upload_max_filesize=256M
post_max_size=258M
memory_limit=256M
expose_php=Off
allow_url_fopen=Off
